name: Publish NVU Docker Images

on:
  push:
    branches:
      - main
    paths:
      - "nouveau-vision-nvu/docker/**"
      - ".github/workflows/publish-images.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish NVU images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        id: owner
        shell: bash
        run: |
          echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish NVUN
        uses: docker/build-push-action@v6
        with:
          context: ./nouveau-vision-nvu/docker/nvun
          file: ./nouveau-vision-nvu/docker/nvun/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/nouveau-vision-nvun:0.1.1
            ghcr.io/${{ steps.owner.outputs.name }}/nouveau-vision-nvun:latest

      - name: Build and publish ASICseer
        uses: docker/build-push-action@v6
        with:
          context: ./nouveau-vision-nvu/docker/asicseer
          file: ./nouveau-vision-nvu/docker/asicseer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/nouveau-vision-asicseer:0.1.1
            ghcr.io/${{ steps.owner.outputs.name }}/nouveau-vision-asicseer:latest
