manifestVersion: 1
id: nouveau-vision-nvu
name: Nouveau-Vision NVU
tagline: Run an NVU full node and solo mining pool on Umbrel
icon: https://nvu.us/nvu-umbrel-app-icon.png
category: bitcoin
version: "1.1.0"
port: 3340

description: >-
  Run a Nouveau-Vision Unit full node and ASICseer solo mining pool
  directly on Umbrel. NVUN connects to the Nouveau-Vision peer-to-peer
  network while ASICseer provides solo SHA-256 mining through Stratum
  on TCP port 3336.

developer: Nouveau-Vision
website: https://nvu.us
submitter: Nouveau-Vision
submission: https://github.com/thenouveauvision/nouveau-vision-umbrel
repo: https://github.com/thenouveauvision/nouveau-vision-umbrel
support: https://nvu.us
gallery: []

releaseNotes: >-
  Adds NVUN 1.0.0 and Dashboard v1.1.0 with expanded mining
  telemetry, recent block solves, live connected miners, read-only
  local wallet monitoring, improved peer identification, persistent
  pagination, and responsive dashboard improvements.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
