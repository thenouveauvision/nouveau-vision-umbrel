description: >-
  Run a Nouveau-Vision Unit full node and ASICseer solo mining pool
  directly on Umbrel. NVUN connects to the Nouveau-Vision peer-to-peer
  network while ASICseer provides solo SHA-256 mining through Stratum
  on TCP port 3336.

